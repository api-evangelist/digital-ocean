openapi: 3.2.0
info:
  title: DigitalOcean Insights API
  version: '2.0'
  description: 'The DigitalOcean Insights API provides observability resources for

    monitoring your infrastructure, including alert rules that evaluate

    metrics, notification channels that deliver alert events, read-only

    alert instances that record when alert rules fire, PromQL, logs, spans,

    and traces query interfaces, and per-resource enablement of the metrics,

    logs, and traces signals.'
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: DigitalOcean API Team
    email: api-engineering@digitalocean.com
  termsOfService: https://www.digitalocean.com/legal/terms-of-service-agreement/
servers:
- url: https://api.digitalocean.com
  description: production
security:
- bearer_auth: []
