- aid: digital-ocean:digital-ocean-databases-api
  name: Digital Ocean Databases API
  description: "DigitalOcean's [managed database service](https://docs.digitalocean.com/products/databases)\n\
    simplifies the creation and management of highly available database clusters. Currently, it\noffers\
    \ support for [PostgreSQL](http://docs.digitalocean.com/products/databases/postgresql/),\n[Redis](https://docs.digitalocean.com/products/databases/redis/),\n\
    [MySQL](https://docs.digitalocean.com/products/databases/mysql/), \n[MongoDB](https://docs.digitalocean.com/products/databases/mongodb/),\
    \ and\n[OpenSearch](https://docs.digitalocean.com/products/databases/opensearch/).\n\nBy sending requests\
    \ to the `/v2/databases` endpoint, you can list, create, or delete\ndatabase clusters as well as scale\
    \ the size of a cluster, add or remove read-only replicas,\nand manage other configuration details.\n\
    \nDatabase clusters may be deployed in a multi-node, high-availability configuration.\nIf your machine\
    \ type is above the basic nodes, your node plan is above the smallest option,\nor you are running\
    \ MongoDB, you may additionally include up to two standby nodes in your cluster.\n\nThe size of individual\
    \ nodes in a database cluster is represented by a human-readable slug,\nwhich is used in some of the\
    \ following requests. Each slug denotes the node's identifier,\nCPU count, and amount of RAM, in that\
    \ order.\n\nFor a list of currently available database slugs and options, use the `/v2/databases/options`\
    \ endpoint or use the \n`doctl databases options` [command](https://docs.digitalocean.com/reference/doctl/reference/databases/options)."
  humanURL: https://docs.digitalocean.com/reference/api/api-reference/
  baseURL: https://api.digitalocean.com/v2
